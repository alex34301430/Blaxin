[package]
name = "blaxin"
version = "1.0.0"
description = "BLAXIN — Personal AI Desktop Agent"
authors = ["BLAXIN"]
edition = "2021"

[lib]
name = "blaxin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
panic = "abort"
