name: Build and Release BLAXIN Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  NODE_BUNDLE_VERSION: '20.18.0'

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: blaxin/client/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            imagemagick

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install minisign for update signing
        run: |
          curl -fsSL -o /tmp/minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz
          tar xzf /tmp/minisign.tar.gz -C /tmp
          sudo cp /tmp/minisign /usr/local/bin/minisign
          minisign --version

      - name: Download and bundle Node.js runtime
        run: |
          echo "Downloading Node.js v${NODE_BUNDLE_VERSION} for Linux x86_64..."
          NODE_URL="https://nodejs.org/dist/v${NODE_BUNDLE_VERSION}/node-v${NODE_BUNDLE_VERSION}-linux-x64.tar.xz"

          # Ensure the resources directory exists (it's gitignored)
          mkdir -p blaxin/resources
          cd blaxin/resources
          rm -rf node
          mkdir -p node

          echo "Downloading from: ${NODE_URL}"
          curl -fsSL "${NODE_URL}" | tar xJ --strip-components=1 -C node

          # Verify the binary exists and works
          node/bin/node --version
          echo "Node.js bundled successfully"
          ls -la node/bin/node

      - name: Install server dependencies
        working-directory: blaxin/server
        run: npm ci

      - name: Build server TypeScript
        working-directory: blaxin/server
        run: npm run build

      - name: Prepare bundled server resources
        run: |
          rm -rf blaxin/resources/blaxin-server
          mkdir -p blaxin/resources/blaxin-server/dist
          cp -r blaxin/server/dist/* blaxin/resources/blaxin-server/dist/
          cp blaxin/server/package.json blaxin/resources/blaxin-server/
          cd blaxin/resources/blaxin-server
          npm install --omit=dev
          echo "Bundled server resources prepared"

      - name: Install client dependencies
        working-directory: blaxin/client
        run: npm ci

      - name: Build client
        working-directory: blaxin/client
        run: npm run build

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version_num=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "version_num=$(echo ${{ github.event.inputs.version }} | sed 's/^v//')" >> $GITHUB_OUTPUT
          fi

      - name: Update version across all components
        working-directory: blaxin
        run: |
          VERSION="${{ steps.version.outputs.version_num }}"
          echo "Setting version to $VERSION across all components"

          # Update server version
          cd server
          npm version "$VERSION" --no-git-tag-version --allow-same-version 2>/dev/null || true
          cd ..

          # Update client version
          cd client
          npm version "$VERSION" --no-git-tag-version --allow-same-version 2>/dev/null || true
          cd ..

          # Update Tauri version
          cd src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" tauri.conf.json
          cd ..

          # Update Cargo.toml version
          cd src-tauri
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cd ..

          # Update server version constant
          cd server/src/utils
          if [ -f version.ts ]; then
            sed -i "s/export const APP_VERSION = '.*'/export const APP_VERSION = '$VERSION'/" version.ts
          fi
          cd ../../..

          echo "All versions updated to $VERSION"

      - name: Convert icons to 8-bit RGBA
        working-directory: blaxin/src-tauri/icons
        run: |
          for f in *.png; do
            if [ -f "$f" ]; then
              convert "$f" -depth 8 PNG32:"$f.tmp" && mv "$f.tmp" "$f"
              echo "Converted $f to 8-bit RGBA"
            fi
          done

      - name: Build Tauri app (AppImage + deb)
        working-directory: blaxin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"
          cd src-tauri
          cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb 2>&1
          cd ..

      - name: Sign AppImage for auto-updates
        working-directory: blaxin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "Signing AppImage for auto-updater..."

          # Find the AppImage
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage found to sign!"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"

          # Tauri's TAURI_SIGNING_PRIVATE_KEY is in base64-encoded minisign format
          # We need to decode it to a raw minisign private key file
          mkdir -p /tmp/signing

          # Write the private key (it contains the full minisign format content)
          echo "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/signing/key.sec

          # Sign the AppImage — minisign uses password from env
          # The key file is already in minisign format (base64 encoded with comment lines)
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -Sm "$APPIMAGE" -s /tmp/signing/key.sec -x "${APPIMAGE}.sig" -t "BLAXIN v${{ steps.version.outputs.version_num }} update" 2>&1 || {
            echo "minisign signing failed, trying alternative approach..."

            # Alternative: decode the base64 key and use it directly
            DECODED_KEY=$(echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null || echo "$TAURI_SIGNING_PRIVATE_KEY")
            echo "$DECODED_KEY" > /tmp/signing/key.decoded.sec
            echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -Sm "$APPIMAGE" -s /tmp/signing/key.decoded.sec -x "${APPIMAGE}.sig" -t "BLAXIN v${{ steps.version.outputs.version_num }} update" 2>&1
          }

          if [ -f "${APPIMAGE}.sig" ]; then
            echo "✓ AppImage signed successfully"
            echo "Signature file: ${APPIMAGE}.sig"
            echo "Signature size: $(wc -c < "${APPIMAGE}.sig") bytes"
            head -3 "${APPIMAGE}.sig"
          else
            echo "ERROR: Signature file was not created!"
            exit 1
          fi

      - name: Find and organize build artifacts
        id: artifacts
        run: |
          echo "Looking for build artifacts..."
          mkdir -p artifacts

          VERSION="${{ steps.version.outputs.version_num }}"

          # Find and copy AppImage
          APPIMAGE=$(find blaxin/src-tauri/target -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" artifacts/BLAXIN_${VERSION}_amd64.AppImage
            echo "Found AppImage: $(basename $APPIMAGE) -> BLAXIN_${VERSION}_amd64.AppImage"
          else
            echo "ERROR: No AppImage found!"
            exit 1
          fi

          # Copy AppImage signature (produced by our signing step)
          APPIMAGE_SIG="${APPIMAGE}.sig"
          if [ -f "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_SIG" artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig
            echo "Found AppImage signature: $(basename $APPIMAGE_SIG)"
          else
            echo "ERROR: No AppImage signature found! Auto-updates cannot work without it."
            ls -la blaxin/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/
            exit 1
          fi

          # Find and copy .deb
          DEB=$(find blaxin/src-tauri/target -name "*.deb" | head -1)
          if [ -n "$DEB" ]; then
            cp "$DEB" artifacts/blaxin_${VERSION}_amd64.deb
            echo "Found .deb: $(basename $DEB) -> blaxin_${VERSION}_amd64.deb"
          fi

          echo "=== All artifacts ==="
          ls -la artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          for f in *.AppImage *.deb; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              echo "Checksum: $(cat $f.sha256)"
            fi
          done

      - name: Generate update manifest (latest.json)
        id: manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"

          # For Tauri v2 Linux AppImage updates, the update artifact IS the AppImage
          # The download URL points directly to the AppImage in the release
          DOWNLOAD_URL="https://github.com/alex34301430/Blaxin/releases/download/${VERSION}/BLAXIN_${VERSION_NUM}_amd64.AppImage"

          # Read the AppImage signature content
          SIG_FILE="artifacts/BLAXIN_${VERSION_NUM}_amd64.AppImage.sig"
          SIG_CONTENT=""
          if [ -f "$SIG_FILE" ]; then
            SIG_CONTENT=$(cat "$SIG_FILE")
            echo "AppImage signature found and included (${#SIG_CONTENT} chars)"
          else
            echo "ERROR: No signature file found!"
            exit 1
          fi

          # Generate latest.json for Tauri updater
          cat > artifacts/latest.json << EOF
          {
            "version": "${VERSION_NUM}",
            "notes": "BLAXIN ${VERSION} — See https://github.com/alex34301430/Blaxin/releases/tag/${VERSION} for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${SIG_CONTENT}",
                "url": "${DOWNLOAD_URL}"
              }
            }
          }
          EOF

          echo "Generated update manifest:"
          cat artifacts/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blaxin-linux-x86_64
          path: |
            artifacts/*.AppImage
            artifacts/*.AppImage.sig
            artifacts/*.deb
            artifacts/*.sha256
            artifacts/latest.json
          retention-days: 30

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: blaxin-linux-x86_64
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Read version from manifest
        id: manifest
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Verify release artifacts
        run: |
          echo "=== Release Artifact Verification ==="
          VERSION="${{ steps.manifest.outputs.version_num }}"

          # Check AppImage exists and is valid
          if [ ! -f "artifacts/BLAXIN_${VERSION}_amd64.AppImage" ]; then
            echo "ERROR: AppImage not found!"
            exit 1
          fi
          APPIMAGE_SIZE=$(stat -c%s "artifacts/BLAXIN_${VERSION}_amd64.AppImage")
          echo "✓ AppImage: $(( APPIMAGE_SIZE / 1024 / 1024 ))MB"

          # Check signature exists and is non-empty
          if [ ! -f "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig" ]; then
            echo "ERROR: AppImage signature not found!"
            exit 1
          fi
          SIG_SIZE=$(stat -c%s "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig")
          if [ "$SIG_SIZE" -lt 100 ]; then
            echo "ERROR: AppImage signature is too small ($SIG_SIZE bytes) - likely empty/invalid"
            exit 1
          fi
          echo "✓ AppImage signature: ${SIG_SIZE} bytes"

          # Check .deb exists
          if [ ! -f "artifacts/blaxin_${VERSION}_amd64.deb" ]; then
            echo "ERROR: .deb not found!"
            exit 1
          fi
          echo "✓ .deb: $(stat -c%s artifacts/blaxin_${VERSION}_amd64.deb | numfmt --to=iec-i)"

          # Check latest.json exists and has correct URL
          if [ ! -f "artifacts/latest.json" ]; then
            echo "ERROR: latest.json not found!"
            exit 1
          fi
          if grep -q "BLAXIN_${VERSION}_amd64.AppImage" artifacts/latest.json; then
            echo "✓ latest.json points to correct AppImage URL"
          else
            echo "ERROR: latest.json does not point to correct AppImage URL!"
            cat artifacts/latest.json
            exit 1
          fi

          # Check signature is in latest.json
          SIG_IN_JSON=$(cat artifacts/latest.json | python3 -c "import sys,json; print(json.load(sys.stdin)['platforms']['linux-x86_64']['signature'])" 2>/dev/null)
          if [ -n "$SIG_IN_JSON" ] && [ "$SIG_IN_JSON" != "" ]; then
            echo "✓ latest.json has non-empty signature (${#SIG_IN_JSON} chars)"
          else
            echo "ERROR: latest.json has empty signature!"
            exit 1
          fi

          echo ""
          echo "=== All verification checks passed ==="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BLAXIN ${{ steps.manifest.outputs.version }}"
          body: |
            ## BLAXIN ${{ steps.manifest.outputs.version }}

            ### Quick Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/alex34301430/Blaxin/main/blaxin/install.sh | bash
            ```

            ### Downloads

            | File | Description |
            |------|-------------|
            | `BLAXIN_${{ steps.manifest.outputs.version_num }}_amd64.AppImage` | Portable Linux app (no install needed) |
            | `blaxin_${{ steps.manifest.outputs.version_num }}_amd64.deb` | Debian/Ubuntu package |

            ### AppImage
            ```bash
            chmod +x BLAXIN_*.AppImage
            ./BLAXIN_*.AppImage
            ```

            ### .deb package
            ```bash
            sudo dpkg -i blaxin_*.deb
            sudo apt-get install -f
            ```
          draft: false
          prerelease: false
          files: |
            artifacts/*.AppImage
            artifacts/*.AppImage.sig
            artifacts/*.deb
            artifacts/*.sha256
            artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit update manifest back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp artifacts/latest.json blaxin/update/latest.json
          git add blaxin/update/latest.json
          git commit -m "chore: update latest.json for ${{ steps.manifest.outputs.version }}" || echo "No changes to commit"
          git push || echo "Could not push update manifest (non-critical)"
