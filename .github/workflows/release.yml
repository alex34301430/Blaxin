name: Build and Release BLAXIN Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  NODE_BUNDLE_VERSION: '20.18.0'

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: blaxin/client/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            imagemagick

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Prepare signing key for Tauri updater
        env:
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Tauri needs either the raw key content or a file path to the key.
          # GitHub Actions secrets may contain the raw minisign private key
          # or a base64-encoded version. Handle both cases.
          mkdir -p /tmp/signing

          # First, try using the secret as-is (raw minisign key content)
          echo "$TAURI_SIGNING_PRIVATE_KEY_RAW" > /tmp/signing/key.sec
          chmod 600 /tmp/signing/key.sec
          KEY_SIZE=$(wc -c < /tmp/signing/key.sec)
          FIRST_LINE=$(head -1 /tmp/signing/key.sec)
          echo "Key file size: ${KEY_SIZE} bytes"
          echo "First line: ${FIRST_LINE}"

          # Check if the first line looks like a valid minisign private key
          if echo "$FIRST_LINE" | grep -q "untrusted comment"; then
            echo "Key appears to be raw minisign format — using as-is"
          else
            # Try base64 decoding
            echo "Key doesn't start with 'untrusted comment', trying base64 decode..."
            DECODED=$(echo "$TAURI_SIGNING_PRIVATE_KEY_RAW" | base64 -d 2>/dev/null)
            DECODED_FIRST=$(echo "$DECODED" | head -1)
            if echo "$DECODED_FIRST" | grep -q "untrusted comment"; then
              echo "Base64 decode successful — using decoded key"
              echo "$DECODED" > /tmp/signing/key.sec
              chmod 600 /tmp/signing/key.sec
            else
              echo "WARNING: Could not determine key format. Using raw content."
              echo "If signing fails, the key may need to be regenerated."
            fi
          fi

          FINAL_SIZE=$(wc -c < /tmp/signing/key.sec)
          echo "Final key size: ${FINAL_SIZE} bytes"
          if [ "$FINAL_SIZE" -lt 50 ]; then
            echo "ERROR: Signing key is too small (${FINAL_SIZE} bytes)"
            exit 1
          fi

      - name: Download and bundle Node.js runtime
        run: |
          echo "Downloading Node.js v${NODE_BUNDLE_VERSION} for Linux x86_64..."
          NODE_URL="https://nodejs.org/dist/v${NODE_BUNDLE_VERSION}/node-v${NODE_BUNDLE_VERSION}-linux-x64.tar.xz"

          # Ensure the resources directory exists (it's gitignored)
          mkdir -p blaxin/resources
          cd blaxin/resources
          rm -rf node
          mkdir -p node

          echo "Downloading from: ${NODE_URL}"
          curl -fsSL "${NODE_URL}" | tar xJ --strip-components=1 -C node

          # Verify the binary exists and works
          node/bin/node --version
          echo "Node.js bundled successfully"
          ls -la node/bin/node

      - name: Install server dependencies
        working-directory: blaxin/server
        run: npm ci

      - name: Build server TypeScript
        working-directory: blaxin/server
        run: npm run build

      - name: Prepare bundled server resources
        run: |
          rm -rf blaxin/resources/blaxin-server
          mkdir -p blaxin/resources/blaxin-server/dist
          cp -r blaxin/server/dist/* blaxin/resources/blaxin-server/dist/
          cp blaxin/server/package.json blaxin/resources/blaxin-server/
          cd blaxin/resources/blaxin-server
          npm install --omit=dev
          echo "Bundled server resources prepared"

      - name: Install client dependencies
        working-directory: blaxin/client
        run: npm ci

      - name: Build client
        working-directory: blaxin/client
        run: npm run build

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version_num=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "version_num=$(echo ${{ github.event.inputs.version }} | sed 's/^v//')" >> $GITHUB_OUTPUT
          fi

      - name: Update version across all components
        working-directory: blaxin
        run: |
          VERSION="${{ steps.version.outputs.version_num }}"
          echo "Setting version to $VERSION across all components"

          # Update server version
          cd server
          npm version "$VERSION" --no-git-tag-version --allow-same-version 2>/dev/null || true
          cd ..

          # Update client version
          cd client
          npm version "$VERSION" --no-git-tag-version --allow-same-version 2>/dev/null || true
          cd ..

          # Update Tauri version
          cd src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" tauri.conf.json
          cd ..

          # Update Cargo.toml version
          cd src-tauri
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cd ..

          # Update server version constant
          cd server/src/utils
          if [ -f version.ts ]; then
            sed -i "s/export const APP_VERSION = '.*'/export const APP_VERSION = '$VERSION'/" version.ts
          fi
          cd ../../..

          echo "All versions updated to $VERSION"

      - name: Convert icons to 8-bit RGBA
        working-directory: blaxin/src-tauri/icons
        run: |
          for f in *.png; do
            if [ -f "$f" ]; then
              convert "$f" -depth 8 PNG32:"$f.tmp" && mv "$f.tmp" "$f"
              echo "Converted $f to 8-bit RGBA"
            fi
          done

      - name: Build Tauri app (AppImage + deb) with updater signing
        working-directory: blaxin
        env:
          # Pass the file PATH to the signing key — Tauri accepts a path or raw key content.
          # Tauri will automatically sign the AppImage and produce .sig
          # when createUpdaterArtifacts is true in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: /tmp/signing/key.sec
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export PATH="${HOME}/.cargo/bin:$PATH"

          echo "=== Verifying signing key ==="
          echo "Key file: /tmp/signing/key.sec"
          echo "Key exists: $(test -f /tmp/signing/key.sec && echo yes || echo no)"
          echo "Key size: $(wc -c < /tmp/signing/key.sec) bytes"
          echo "First line: $(head -1 /tmp/signing/key.sec)"

          echo "=== Building Tauri app ==="
          cd src-tauri
          cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb 2>&1
          BUILD_EXIT=$?
          cd ..

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: Tauri build failed with exit code $BUILD_EXIT"
            exit 1
          fi

          echo "=== Verifying updater artifacts ==="
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          if [ -d "$BUNDLE_DIR" ]; then
            echo "Bundle directory contents:"
            ls -la "$BUNDLE_DIR"
            # Check for .sig file (Tauri generates this when createUpdaterArtifacts is true)
            SIG_FILE=$(find "$BUNDLE_DIR" -name "*.AppImage.sig" | head -1)
            if [ -n "$SIG_FILE" ]; then
              echo "✓ Tauri generated updater signature: $SIG_FILE"
              echo "  Signature size: $(wc -c < "$SIG_FILE") bytes"
              echo "  First 3 lines:"
              head -3 "$SIG_FILE"
            else
              echo "WARNING: No .sig file found in bundle directory"
              echo "  Files present:"
              ls -la "$BUNDLE_DIR"
              # List all .sig files in the entire target directory for debugging
              echo "  All .sig files in target:"
              find src-tauri/target -name "*.sig" 2>/dev/null || echo "    (none)"
            fi
          else
            echo "ERROR: Bundle directory not found!"
            echo "Checking alternative locations..."
            find src-tauri/target -name "*.AppImage" -o -name "*.deb" 2>/dev/null | head -5
            exit 1
          fi

      - name: Find and organize build artifacts
        id: artifacts
        run: |
          echo "Looking for build artifacts..."
          mkdir -p artifacts

          VERSION="${{ steps.version.outputs.version_num }}"
          BUNDLE_DIR="blaxin/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"

          # Find and copy AppImage
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" artifacts/BLAXIN_${VERSION}_amd64.AppImage
            echo "✓ AppImage: $(du -h artifacts/BLAXIN_${VERSION}_amd64.AppImage | cut -f1)"
          else
            echo "ERROR: No AppImage found!"
            exit 1
          fi

          # Find and copy AppImage signature (generated by Tauri with createUpdaterArtifacts)
          APPIMAGE_SIG=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage.sig" 2>/dev/null | head -1)
          if [ -n "$APPIMAGE_SIG" ] && [ -s "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_SIG" artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig
            SIG_SIZE=$(wc -c < "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig")
            echo "✓ AppImage signature: ${SIG_SIZE} bytes"
            if [ "$SIG_SIZE" -lt 50 ]; then
              echo "ERROR: Signature file is too small (${SIG_SIZE} bytes) - likely invalid"
              exit 1
            fi
          else
            echo "ERROR: No valid AppImage signature found!"
            echo "  Looking in: $BUNDLE_DIR/appimage/"
            ls -la "$BUNDLE_DIR/appimage/" 2>/dev/null || echo "  Directory does not exist"
            exit 1
          fi

          # Find and copy .deb
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            cp "$DEB" artifacts/blaxin_${VERSION}_amd64.deb
            echo "✓ .deb: $(du -h artifacts/blaxin_${VERSION}_amd64.deb | cut -f1)"
          fi

          echo ""
          echo "=== All artifacts ==="
          ls -la artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          for f in *.AppImage *.deb; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              echo "Checksum: $(cat $f.sha256)"
            fi
          done

      - name: Generate update manifest (latest.json)
        id: manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"

          # For Tauri v2 Linux AppImage updates with createUpdaterArtifacts:
          # The update artifact IS the AppImage itself (not a .tar.gz)
          # The download URL points directly to the AppImage in the release
          DOWNLOAD_URL="https://github.com/alex34301430/Blaxin/releases/download/${VERSION}/BLAXIN_${VERSION_NUM}_amd64.AppImage"

          # Read the Tauri-generated AppImage signature content
          SIG_FILE="artifacts/BLAXIN_${VERSION_NUM}_amd64.AppImage.sig"
          if [ ! -f "$SIG_FILE" ] || [ ! -s "$SIG_FILE" ]; then
            echo "ERROR: No valid signature file found at $SIG_FILE"
            exit 1
          fi

          # The .sig file contains the minisign signature - read it for latest.json
          SIG_CONTENT=$(cat "$SIG_FILE")
          echo "AppImage signature loaded: ${#SIG_CONTENT} chars"

          # Verify signature is non-empty and has expected format (minisign sigs have 2 lines)
          LINE_COUNT=$(echo "$SIG_CONTENT" | wc -l)
          echo "Signature line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 2 ]; then
            echo "ERROR: Signature does not have expected minisign format (at least 2 lines)"
            echo "Content: $SIG_CONTENT"
            exit 1
          fi

          # Generate latest.json for Tauri updater
          cat > artifacts/latest.json << EOF
          {
            "version": "${VERSION_NUM}",
            "notes": "BLAXIN ${VERSION} — See https://github.com/alex34301430/Blaxin/releases/tag/${VERSION} for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${SIG_CONTENT}",
                "url": "${DOWNLOAD_URL}"
              }
            }
          }
          EOF

          echo ""
          echo "=== Generated update manifest ==="
          cat artifacts/latest.json

          # Verify the JSON is valid and signature is non-empty
          python3 -c "
          import json, sys
          with open('artifacts/latest.json') as f:
              data = json.load(f)
          sig = data['platforms']['linux-x86_64']['signature']
          if not sig:
              print('ERROR: signature is empty in generated JSON')
              sys.exit(1)
          print(f'✓ JSON valid, signature: {len(sig)} chars')
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blaxin-linux-x86_64
          path: |
            artifacts/*.AppImage
            artifacts/*.AppImage.sig
            artifacts/*.deb
            artifacts/*.sha256
            artifacts/latest.json
          retention-days: 30

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: blaxin-linux-x86_64
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Read version from manifest
        id: manifest
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Verify release artifacts
        run: |
          echo "=== Release Artifact Verification ==="
          VERSION="${{ steps.manifest.outputs.version_num }}"

          # Check AppImage exists and is valid
          if [ ! -f "artifacts/BLAXIN_${VERSION}_amd64.AppImage" ]; then
            echo "ERROR: AppImage not found!"
            exit 1
          fi
          APPIMAGE_SIZE=$(stat -c%s "artifacts/BLAXIN_${VERSION}_amd64.AppImage")
          echo "✓ AppImage: $(( APPIMAGE_SIZE / 1024 / 1024 ))MB"

          # Check signature exists and is non-empty
          if [ ! -f "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig" ]; then
            echo "ERROR: AppImage signature not found!"
            exit 1
          fi
          SIG_SIZE=$(stat -c%s "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig")
          if [ "$SIG_SIZE" -lt 50 ]; then
            echo "ERROR: AppImage signature is too small ($SIG_SIZE bytes) - likely empty/invalid"
            exit 1
          fi
          echo "✓ AppImage signature: ${SIG_SIZE} bytes"

          # Check signature has minisign format (at least 2 lines)
          SIG_LINES=$(wc -l < "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig")
          if [ "$SIG_LINES" -lt 2 ]; then
            echo "ERROR: Signature does not have minisign format (only $SIG_LINES lines)"
            exit 1
          fi
          echo "✓ AppImage signature format: ${SIG_LINES} lines (valid minisign)"

          # Check .deb exists
          if [ ! -f "artifacts/blaxin_${VERSION}_amd64.deb" ]; then
            echo "ERROR: .deb not found!"
            exit 1
          fi
          echo "✓ .deb: $(stat -c%s artifacts/blaxin_${VERSION}_amd64.deb | numfmt --to=iec-i)"

          # Check latest.json exists and has correct URL
          if [ ! -f "artifacts/latest.json" ]; then
            echo "ERROR: latest.json not found!"
            exit 1
          fi
          if grep -q "BLAXIN_${VERSION}_amd64.AppImage" artifacts/latest.json; then
            echo "✓ latest.json points to correct AppImage URL"
          else
            echo "ERROR: latest.json does not point to correct AppImage URL!"
            cat artifacts/latest.json
            exit 1
          fi

          # Check signature is in latest.json and is non-empty
          SIG_IN_JSON=$(python3 -c "
          import json, sys
          with open('artifacts/latest.json') as f:
              data = json.load(f)
          sig = data['platforms']['linux-x86_64']['signature']
          print(sig)
          " 2>/dev/null)
          if [ -n "$SIG_IN_JSON" ] && [ "$SIG_IN_JSON" != "" ]; then
            echo "✓ latest.json has non-empty signature (${#SIG_IN_JSON} chars)"
          else
            echo "ERROR: latest.json has empty signature!"
            exit 1
          fi

          # Verify signature in JSON matches the .sig file
          SIG_FILE_CONTENT=$(cat "artifacts/BLAXIN_${VERSION}_amd64.AppImage.sig")
          if [ "$SIG_IN_JSON" = "$SIG_FILE_CONTENT" ]; then
            echo "✓ Signature in latest.json matches .sig file"
          else
            echo "WARNING: Signature in latest.json differs from .sig file"
          fi

          echo ""
          echo "=== All verification checks passed ==="

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BLAXIN ${{ steps.manifest.outputs.version }}"
          body: |
            ## BLAXIN ${{ steps.manifest.outputs.version }}

            ### Quick Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/alex34301430/Blaxin/main/blaxin/install.sh | bash
            ```

            ### Downloads

            | File | Description |
            |------|-------------|
            | `BLAXIN_${{ steps.manifest.outputs.version_num }}_amd64.AppImage` | Portable Linux app (no install needed) |
            | `blaxin_${{ steps.manifest.outputs.version_num }}_amd64.deb` | Debian/Ubuntu package |

            ### AppImage
            ```bash
            chmod +x BLAXIN_*.AppImage
            ./BLAXIN_*.AppImage
            ```

            ### .deb package
            ```bash
            sudo dpkg -i blaxin_*.deb
            sudo apt-get install -f
            ```
          draft: false
          prerelease: false
          files: |
            artifacts/*.AppImage
            artifacts/*.AppImage.sig
            artifacts/*.deb
            artifacts/*.sha256
            artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit update manifest back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp artifacts/latest.json blaxin/update/latest.json
          git add blaxin/update/latest.json
          git commit -m "chore: update latest.json for ${{ steps.manifest.outputs.version }}" || echo "No changes to commit"
          git push || echo "Could not push update manifest (non-critical)"
